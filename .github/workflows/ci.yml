name: host-checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libopencv-dev
      - run: python -m pip install clang-format==18.1.8
      - run: python tools/check_cpp_format.py
      - run: cmake -S . -B build-host -DEDGE_BUILD_AGENT=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-host -j2
      - run: ctest --test-dir build-host --output-on-failure
      - run: python -m compileall -q tools tests cloud
